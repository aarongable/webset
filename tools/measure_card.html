<!doctype html><meta charset="utf-8">
<canvas id="c" style="display:none"></canvas><pre id="out"></pre>
<script>
// Generic card/symbol measurement for landscape cards on a dark background.
// ?img=file&rects=x0,y0,w,h;x0,y0,w,h;...
const q = new URLSearchParams(location.search);
const rects = q.get('rects').split(';').map((r) => r.split(',').map(Number));
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
  const results = [];
  for (const [rx, ry, rw, rh] of rects) {
    const d = ctx.getImageData(rx, ry, rw, rh).data;
    const px = (x, y) => { const i = (y * rw + x) * 4; return [d[i], d[i+1], d[i+2]]; };
    const bright = (p) => p[0] + p[1] + p[2] > 480;
    const ink = (p) => (Math.max(...p) - Math.min(...p) > 45) || (p[0] + p[1] + p[2] < 400 && bright(p) === false && false);
    // card bbox: rows/cols with >50% bright
    const colB = new Array(rw).fill(0), rowB = new Array(rh).fill(0);
    for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) if (bright(px(x, y))) { colB[x]++; rowB[y]++; }
    const first = (a, t) => a.findIndex((v) => v > t), last = (a, t) => a.length - 1 - a.slice().reverse().findIndex((v) => v > t);
    const cx0 = first(colB, rh * .5), cx1 = last(colB, rh * .5), cy0 = first(rowB, rw * .5), cy1 = last(rowB, rw * .5);
    const cw = cx1 - cx0, ch = cy1 - cy0;
    // ink projections inside the card (with inset to avoid edges)
    const inset = Math.round(Math.min(cw, ch) * 0.04);
    const colI = new Array(rw).fill(0), rowI = new Array(rh).fill(0);
    for (let y = cy0 + inset; y < cy1 - inset; y++) for (let x = cx0 + inset; x < cx1 - inset; x++) if (ink(px(x, y))) { colI[x]++; rowI[y]++; }
    // symbols: runs of columns with ink count > 2 (allow small gaps)
    const syms = []; let cur = null, gap = 0;
    for (let x = cx0; x <= cx1; x++) {
      const on = colI[x] > 2;
      if (on) { if (!cur) cur = { x0: x }; cur.x1 = x; gap = 0; }
      else if (cur) { gap++; if (gap > Math.round(cw * 0.02)) { syms.push(cur); cur = null; gap = 0; } }
    }
    if (cur) syms.push(cur);
    for (const s of syms) {
      let y0 = rh, y1 = -1;
      for (let y = cy0 + inset; y < cy1 - inset; y++) { let n = 0; for (let x = s.x0; x <= s.x1; x++) if (ink(px(x, y))) n++; if (n > 1) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); } }
      s.y0 = y0; s.y1 = y1; s.w = s.x1 - s.x0; s.h = y1 - y0; s.cx = (s.x0 + s.x1) / 2; s.cy = (y0 + y1) / 2;
    }
    const S = ch; // card short side (landscape)
    const r = { card: { w: cw, h: ch, aspect: +(cw / ch).toFixed(3) }, n: syms.length,
      symLong: syms.map((s) => +(s.h / S).toFixed(3)), symShort: syms.map((s) => +(s.w / S).toFixed(3)),
      cx: syms.map((s) => +((s.cx - cx0) / cw).toFixed(3)), cy: syms.map((s) => +((s.cy - cy0) / ch).toFixed(3)) };
    if (syms.length > 1) { const p = []; for (let i = 1; i < syms.length; i++) p.push((syms[i].cx - syms[i-1].cx) / S); r.pitch = p.map((v) => +v.toFixed(3)); r.gap = syms.slice(1).map((s, i) => +((s.x0 - syms[i].x1) / S).toFixed(3)); }
    results.push(r);
  }
  document.getElementById('out').textContent = JSON.stringify(results);
  document.title = 'OK';
};
img.src = q.get('img');
</script>
