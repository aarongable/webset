name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the repository at checkout; the deploy job
# adds the Pages permissions it requires.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p _site/js
          cp index.html style.css manifest.webmanifest sw.js _site/
          cp js/*.js _site/js/
          cp -R icons _site/icons
          # Version the service worker cache with the commit so installed
          # copies pick up every deploy without a manual bump.
          sed -i "s/const CACHE = 'webset-v1';/const CACHE = 'webset-${SHA:0:8}';/" _site/sw.js
          grep -q "webset-${SHA:0:8}" _site/sw.js
          # Stamp the build for the About dialog.
          DATE="$(git log -1 --format=%cI "$SHA")"
          printf "window.WEBSET_VERSION = { sha: '%s', date: '%s' };\n" "${SHA:0:8}" "$DATE" > _site/js/version.js
          cat _site/js/version.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
